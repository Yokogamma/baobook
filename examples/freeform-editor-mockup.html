<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чистий аркуш · редактор</title>
<meta name="description" content="Порожній редактор у стилі Notion: клацніть у будь-якому місці аркуша і пишіть саме там; блоки перетягуються за ручку ⋮⋮, розкладка масштабується під розмір екрана.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* ── палітра Notion-like, світла + темна ─────────────────────────── */
:root{
  --page:#ffffff; --ink:#37352f; --ink-2:#787774; --ink-3:#b4b3b0;
  --line:rgba(55,53,47,.09); --line-2:rgba(55,53,47,.16);
  --hover:rgba(55,53,47,.06); --hover-2:rgba(55,53,47,.12);
  --sel:rgba(35,131,226,.14); --sel-line:rgba(35,131,226,.55);
  --shadow:0 4px 18px rgba(15,15,15,.14), 0 0 0 .5px rgba(15,15,15,.08);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --pad:24px; --handle:22px; --fs:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#191919; --ink:#e6e6e4; --ink-2:#9b9b98; --ink-3:#5f5f5c;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --hover:rgba(255,255,255,.07); --hover-2:rgba(255,255,255,.13);
    --sel:rgba(35,131,226,.22); --sel-line:rgba(89,164,240,.6);
    --shadow:0 4px 18px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --page:#191919; --ink:#e6e6e4; --ink-2:#9b9b98; --ink-3:#5f5f5c;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --hover:rgba(255,255,255,.07); --hover-2:rgba(255,255,255,.13);
  --sel:rgba(35,131,226,.22); --sel-line:rgba(89,164,240,.6);
  --shadow:0 4px 18px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
}
@media (max-width:640px){ :root{ --pad:14px; --handle:20px; --fs:17px; } }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit}
.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── тонка шапка як у Notion ──────────────────────────────────────── */
.top{position:fixed;inset:0 0 auto 0;z-index:5;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none;
  background:linear-gradient(var(--page) 60%,transparent)}
.top>*{pointer-events:auto}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);padding:4px 8px;border-radius:6px}
.crumb:hover{background:var(--hover)}
.crumb b{font-weight:500;color:var(--ink)}
.tools{display:flex;align-items:center;gap:2px}
.tb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;cursor:pointer}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb .i{font-size:16px}
.cnt{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px;padding:0 6px}

/* ── аркуш: займає весь екран, зростає донизу, коли блоки виходять за межу ── */
.sheet{position:relative;width:100%;min-height:100dvh;cursor:text;
  /* ледь помітна сітка, щоб відчувався «аркуш» — вимикається кнопкою */
  background-image:radial-gradient(var(--line-2) .8px,transparent .9px);background-size:24px 24px;background-position:12px 12px}
.sheet.nogrid{background-image:none}

/* підказка на порожньому аркуші */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;
  color:var(--ink-3);text-align:center;padding:0 24px;transition:opacity .25s}
.empty .big{font-size:20px;font-weight:500;color:var(--ink-2)}
.empty .sm{font-size:13.5px;line-height:1.5;max-width:34ch}
.empty kbd{font:inherit;font-size:12px;padding:1px 6px;border:.5px solid var(--line-2);border-bottom-width:1.5px;border-radius:4px;color:var(--ink-2)}
.sheet.has .empty{opacity:0}

/* ── текстовий блок ───────────────────────────────────────────────── */
.blk{position:absolute;display:flex;align-items:flex-start;gap:2px;max-width:calc(100% - var(--pad));border-radius:6px;transition:box-shadow .12s,background .12s}
.blk .txt{flex:1 1 auto;min-width:0;min-height:1.5em;padding:3px 6px;font-size:var(--fs);line-height:1.5;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:var(--ink);border-radius:4px}
.blk .txt:empty::before{content:attr(data-ph);color:var(--ink-3);pointer-events:none}
.blk .txt:focus{background:transparent}
/* ручка ⋮⋮ — як у Notion, зʼявляється при наведенні або при фокусі (для тачу) */
.grip{flex:0 0 var(--handle);width:var(--handle);height:24px;margin-top:2px;display:flex;align-items:center;justify-content:center;border-radius:4px;
  color:var(--ink-3);cursor:grab;opacity:0;transition:opacity .12s,background .12s;touch-action:none;user-select:none;-webkit-user-select:none}
.grip svg{width:14px;height:14px;fill:currentColor;stroke:none}
.grip:hover{background:var(--hover-2);color:var(--ink-2)}
.blk:hover .grip,.blk.focus .grip,.blk.drag .grip{opacity:1}
.blk:hover{background:var(--hover)}
.blk.focus{background:transparent}
.blk.drag{background:var(--page);box-shadow:var(--shadow);cursor:grabbing;z-index:10}
.blk.drag .grip{cursor:grabbing}
.blk.drag .txt{pointer-events:none}
@media (hover:none){ .grip{opacity:.45} .blk .grip{margin-left:-2px} }

/* мітка-курсор у місці кліку (на мить), щоб було видно, «де» почався текст */
.ping{position:absolute;width:2px;height:22px;background:var(--sel-line);border-radius:1px;pointer-events:none;animation:ping .5s ease-out forwards}
@keyframes ping{0%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.4)}}

/* нижній тост із підказкою після першого блока */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(8px);z-index:6;padding:8px 12px;border-radius:8px;
  background:var(--page);box-shadow:var(--shadow);color:var(--ink-2);font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{font-weight:500;color:var(--ink)}
@media (max-width:640px){ .toast{white-space:normal;max-width:calc(100vw - 32px);text-align:center} }
</style>
</head>
<body>

<header class="top">
  <div class="crumb"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg><b>Без назви</b></div>
  <div class="tools">
    <span class="cnt" id="cnt" title="Кількість блоків"></span>
    <button class="tb" id="gridBtn" title="Сітка аркуша"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg></button>
    <button class="tb" id="themeBtn" title="Тема"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    <button class="tb" id="clearBtn" title="Очистити аркуш"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
</header>

<main class="sheet" id="sheet">
  <div class="empty" id="empty">
    <div class="big">Клацніть будь-де — і пишіть саме там</div>
    <div class="sm">Аркуш порожній і займає весь екран. Наведіть на фразу, щоб зʼявилася ручка <kbd>⋮⋮</kbd> — за неї фразу можна перетягнути в інше місце.</div>
  </div>
</main>

<div class="toast" id="toast">Готово. <b>Enter</b> — новий рядок, <b>Esc</b> — вийти, <b>Backspace</b> у порожньому блоці — видалити.</div>

<script>
(function(){
  const sheet=document.getElementById('sheet'), empty=document.getElementById('empty'),
        cnt=document.getElementById('cnt'), toast=document.getElementById('toast');
  const KEY='freeform-editor-v1';
  const MINW=140;           // мінімальна ширина блока, px
  let blocks=[];            // {id, fx, fy, text}   fx,fy — частки від розміру аркуша (0..1)
  let toastShown=false;

  /* ── розміри аркуша: завжди весь екран; зростає, якщо блок нижче за екран ── */
  function sheetW(){ return sheet.clientWidth; }
  function sheetH(){ return Math.max(sheet.clientHeight, window.innerHeight); }

  /* ── розкладка: перерахунок px із часток; ширина — до правого краю (макс. вільний простір) ── */
  function layout(b){
    const W=sheetW(), H=sheetH(), pad=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pad'))||24;
    const handle=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--handle'))||22;
    let x=Math.round(b.fx*W), y=Math.round(b.fy*H);
    // блок не може стати вужчим за MINW — тоді зсуваємо його ліворуч
    x=Math.min(x, Math.max(pad, W-pad-MINW));
    x=Math.max(x, pad-handle);             // ручка може трохи «висіти» за полем
    y=Math.max(y, 48);                     // під шапкою
    b.el.style.left=x+'px'; b.el.style.top=y+'px';
    b.el.style.width=(W-pad-x)+'px';       // займаємо все, що є праворуч
  }
  function layoutAll(){ blocks.forEach(layout); growSheet(); }
  function growSheet(){
    // якщо нижній блок виходить за екран — подовжуємо аркуш (скрол), інакше рівно екран
    let bottom=0; blocks.forEach(b=>{ bottom=Math.max(bottom,b.el.offsetTop+b.el.offsetHeight); });
    sheet.style.minHeight=Math.max(window.innerHeight, bottom+120)+'px';
  }

  /* ── створення блока ────────────────────────────────────────────── */
  function make(data, focus){
    const b={id:data.id||('b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)), fx:data.fx, fy:data.fy, text:data.text||''};
    const el=document.createElement('div'); el.className='blk';
    el.innerHTML='<div class="grip" title="Перетягнути"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg></div>'+
                 '<div class="txt" contenteditable="true" spellcheck="true" data-ph="Пишіть…"></div>';
    const txt=el.querySelector('.txt'); txt.textContent=b.text;
    b.el=el; b.txt=txt; sheet.appendChild(el); blocks.push(b); layout(b);

    txt.addEventListener('focus',()=>el.classList.add('focus'));
    txt.addEventListener('blur',()=>{ el.classList.remove('focus'); if(!txt.textContent.trim()) remove(b); else save(); });
    txt.addEventListener('input',()=>{ b.text=txt.textContent; growSheet(); save(); });
    txt.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ txt.blur(); }
      if(e.key==='Backspace' && !txt.textContent){ e.preventDefault(); remove(b); }
    });
    txt.addEventListener('paste',e=>{ // лише простий текст
      e.preventDefault(); document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'));
    });
    // клік по самому блоку (не по порожньому аркушу) не створює новий
    el.addEventListener('pointerdown',e=>e.stopPropagation());
    drag(b, el.querySelector('.grip'));

    update();
    if(focus){ txt.focus(); }
    return b;
  }
  function remove(b){
    blocks=blocks.filter(x=>x!==b); b.el.remove(); update(); save();
  }
  function update(){
    sheet.classList.toggle('has', blocks.length>0);
    cnt.textContent=blocks.length? blocks.length+(blocks.length===1?' блок':blocks.length<5?' блоки':' блоків') : '';
    growSheet();
  }

  /* ── клік по порожньому аркушу → новий блок саме тут ─────────────── */
  sheet.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    const r=sheet.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    // мітка в місці кліку
    const p=document.createElement('div'); p.className='ping'; p.style.left=x+'px'; p.style.top=(y-11)+'px'; sheet.appendChild(p); setTimeout(()=>p.remove(),500);
    // курсор кліку — це початок тексту: віднімаємо ширину ручки й відступ тексту, а по вертикалі центруємо рядок
    const handle=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--handle'))||22;
    const b=make({fx:(x-handle-6)/sheetW(), fy:(y-15)/sheetH()}, false);
    save();
    // фокус після завершення pointerdown, інакше браузер зніме його
    e.preventDefault(); setTimeout(()=>b.txt.focus(),0);
    if(!toastShown){ toastShown=true; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),4500); }
  });

  /* ── перетягування за ручку (миша + тач через Pointer Events) ─────── */
  function drag(b, grip){
    let sx,sy,ox,oy,moved;
    grip.addEventListener('pointerdown',e=>{
      e.stopPropagation(); e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      sx=e.clientX; sy=e.clientY; ox=b.el.offsetLeft; oy=b.el.offsetTop; moved=false;
      b.el.classList.add('drag');
    });
    grip.addEventListener('pointermove',e=>{
      if(!b.el.classList.contains('drag')) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
      b.el.style.left=(ox+dx)+'px'; b.el.style.top=(oy+dy)+'px';
    });
    const end=e=>{
      if(!b.el.classList.contains('drag')) return;
      b.el.classList.remove('drag');
      // фіксуємо нове місце у частках аркуша, щоб розкладка пережила ресайз
      b.fx=b.el.offsetLeft/sheetW(); b.fy=b.el.offsetTop/sheetH();
      layout(b); growSheet(); save();
      if(!moved) b.txt.focus();   // простий тап по ручці на тачі = редагувати
    };
    grip.addEventListener('pointerup',end); grip.addEventListener('pointercancel',end);
  }

  /* ── ресайз вікна / поворот екрана: усе перераховуємо з часток ───── */
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(layoutAll,60); });

  /* ── збереження в localStorage (щоб перезавантаження не стирало) ─── */
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(blocks.map(b=>({id:b.id,fx:b.fx,fy:b.fy,text:b.text})))); }catch(_){} }
  function load(){ try{ const a=JSON.parse(localStorage.getItem(KEY)||'[]'); a.forEach(d=>make(d,false)); }catch(_){} }

  /* ── кнопки шапки ────────────────────────────────────────────────── */
  document.getElementById('clearBtn').addEventListener('click',()=>{ if(!blocks.length||confirm('Очистити аркуш?')){ blocks.slice().forEach(remove); } });
  document.getElementById('gridBtn').addEventListener('click',()=>{ sheet.classList.toggle('nogrid'); try{localStorage.setItem(KEY+':grid',sheet.classList.contains('nogrid')?'0':'1');}catch(_){} });
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    document.documentElement.dataset.theme = cur==='dark'?'light':'dark';
  });
  try{ if(localStorage.getItem(KEY+':grid')==='0') sheet.classList.add('nogrid'); }catch(_){}

  load(); update();
})();
</script>
</body>
</html>
