/* the start, seen: after 1 s the strip says what the app waits for (the storage opening, then the notes being read), after 5 s that the storage is
   slow to answer; on a phone the strip stays above the open panel (.wait); the last list shows greyed in the panel meanwhile (sheet:listsnap) */
let waitSlow=false;
function waitUI(){ if(STARTED) return;
  // a lock found before the start's end (newer data, blocked, the storage): its own message, only «Оновити» (nothing is loaded to export yet)
  if(LOCK){ roSync(); roExport.hidden=true; roStrip.hidden=false; app.classList.add('wait'); return; }
  // the start's upgrade request waits for another tab (idbWait, IDB-BARRIER-PLAN §3.1): that says why, before «slow»; «Оновити» only after WAIT_LONG
  if(idb.waiting){ roMsg.textContent=loc(idb.waiting==='long'? 'lock.waitLong' : idb.waiting==='blocked'? 'lock.waitTab' : 'lock.waitSilent'); roStrip.hidden=false; for(const b of [roRestore,roPurge,roExport]) b.hidden=true; roReload.hidden=idb.waiting!=='long'; app.classList.add('wait'); return; }
  roMsg.textContent=loc(waitSlow? 'boot.slow' : idb.db? 'boot.waiting' : 'lock.opening'); roStrip.hidden=false; for(const b of [roRestore,roPurge,roExport,roReload]) b.hidden=true; app.classList.add('wait'); }
async function start(){
  const w1=setTimeout(waitUI, 1000), w2=setTimeout(()=>{ waitSlow=true; waitUI(); }, 5000), beat=setInterval(()=>{ BOOT.w=Math.round(performance.now()); bootSave(); }, 2000);
  if(!list.children.length) snapShow(loc('boot.snapWait'));
  await db.init(); SYNC=makeEngine(); if(!roStrip.hidden) waitUI();   // the storage is open: the strip, if shown, now says the notes are being read
  if(db.backend==='idb' && !LOCK){   // the sync core first: the device record (written once: every tab of the device writes as it), the engine loaded from the store, the fallback copies moved in through it, then lrev of every note
    try{ await SDB.tx(['sync'],'readwrite', async t=>{ if(!(await t.get('sync','device'))) t.put('sync',{k:'device', id:S.devId, name:S.devName}); }); }catch(_){}
    try{ await SYNC.reload(); if(SYNC.devId!==S.devId || SYNC.devName!==S.devName) saveS({devId:SYNC.devId, devName:SYNC.devName}); }catch(_){} boot('sync');
    try{ await db.move(); for(const [id,l] of Object.entries(await SYNC.lrevOf())) LREV.set(id,l); }catch(_){} boot('move'); }
  notes=await db.all(); boot('notes'); vstart(); app.classList.toggle('local', db.backend!=='idb');
  window.addEventListener('online',()=>{ if(SYNC){ SYNC.online(true); syncWake(); } }); window.addEventListener('offline',()=>{ if(SYNC) SYNC.online(false); }); document.addEventListener('visibilitychange',()=>{ if(!document.hidden && SYNC) syncWake(); });
  // міграція з одноаркушевого мокапа (той самий origin): його аркуш стає першою нотаткою, старі налаштування — спільними
  if(LOCK && db.backend==='idb'){ const had=new Set(notes.map(n=>n.id)); fbMerge(notes, store.keys(NK).map(k=>store.get(k)).filter(validNote)); notes.forEach(n=>{ if(!had.has(n.id)) MEM.add(n.id); }); }   // view-only: the fallback copies show and export, in memory
  if(!notes.length && !LOCK){ const old=store.get('freeform-editor-v4'); if(Array.isArray(old)&&old.length){ const n=newNote(); n.blocks=old.map(b=>({id:b.id,fx:b.fx,row:b.row,text:b.text||''})); writeNote(n); } }
  if(S.theme===undefined && THEMES.includes(store.raw('freeform-editor-v4:theme'))) saveS({theme:store.raw('freeform-editor-v4:theme')});
  if(S.grid===undefined && store.raw('freeform-editor-v4:grid')==='0') saveS({grid:false});
  if(S.spell===undefined && store.raw('freeform-editor-v4:spell')==='1') saveS({spell:true});
  purgeOld(); setInterval(purgeOld, 36e5);
  if(!notes.some(listed)) newNote();
  notes.sort((a,b)=>b.updated-a.updated);
  const how=((performance.getEntriesByType && performance.getEntriesByType('navigation')[0])||{}).type;   // a reload keeps this tab's note (its address names it anyway)
  renderList(); const byId=id=>id && notes.find(n=>n.id===id && !n.deleted), to=how==='reload' && !TORN? null : hashTo(), t=to && linkTarget(to);   // an address with a note (a link opened in a new tab, a bookmark) wins; also on a reload out of the recovery strip (TORN): the app never started on that address
  openNote((t && t.n)||byId(tabCur.get())||byId(S.current)||firstNote(), {restore:!(t && t.n)}); field(); storageUI();
  if(t && t.n && t.bid){ setHash(to); showBlock(t); }   // a note that is not here: the usual note, quietly (the address may be this tab's own, from before a reload)
  clearTimeout(w1); clearTimeout(w2); clearInterval(beat); app.classList.remove('wait'); boot('start');
  STARTED=true; roSync(); snapSave(); TABQ.splice(0).forEach(tabMsg); if(SYNC && SYNC.owner) leadAsk(); accStart();   // from here the notes can change, and a LOCK found later (a reopened connection) locks the screen at once; with an owner the tab asks to lead (the engine runs only in the leader), and the account brings the cloud
}
applyText(); textUI();
if(THEMES.includes(S.theme)) document.documentElement.dataset.theme=S.theme; themeUI();
if(S.grid===false) sheet.classList.add('nogrid'); gridUI();
spell=S.spell===true; spellUI();
app.classList.toggle('open', isMobile()? false : S.side!==false); sideBtn.setAttribute('aria-expanded', app.classList.contains('open')?'true':'false');
sheet.inert=true; ttl.contentEditable='false';   // until start() is done (roSync opens them then)
applyMode(); start();

/* ══ language: the choice is saved in settings and applied by reloading, so every string comes from one file ══ */
langSel.innerHTML=I18N.langs.map(l=>'<option value="'+l+'">'+locA('lang.'+l)+'</option>').join(''); langSel.value=I18N.lang;
langSel.addEventListener('change',()=>{ saveS({lang:langSel.value}); location.reload(); });

/* налаштування за шестернею: закривається вибором пункту, дотиком поза меню, Esc або системним «Назад»; з клавіатури фокус одразу в меню */
function setMenu(open, o={}){ if(open===!setPop.hidden) return; if(open){ closeActs(); bootUI(); } setPop.hidden=!open; app.classList.toggle('menu', open);   // the settings and a list item's action mode never stay open together (LIST-ACTIONS-PLAN 4.4)
  setBtn.setAttribute('aria-expanded',open?'true':'false');
  if(open){ document.addEventListener('pointerdown',setOut,true); document.addEventListener('keydown',setKey,true); nav.open('settings', ()=>setMenu(false)); if(o.kb) setPop.querySelector('select').focus(); return; }
  document.removeEventListener('pointerdown',setOut,true); document.removeEventListener('keydown',setKey,true); nav.close('settings'); if(setPop.contains(document.activeElement)) setBtn.focus(); }
function setOut(e){ if(!setPop.contains(e.target) && !setBtn.contains(e.target)) setMenu(false); }
function setKey(e){ if(e.key==='Escape'){ e.stopPropagation(); e.preventDefault(); setMenu(false); setBtn.focus(); } }
setBtn.addEventListener('click',e=>setMenu(setPop.hidden, {kb:e.detail===0}));
[exportBtn, importBtn, installBtn].forEach(b=>b.addEventListener('click',()=>setMenu(false)));
// колесо над панеллю гортає список нотаток — і над шапкою, пошуком та підвалом, — а не аркуш під нею; над правою частиною гортається аркуш
side.addEventListener('wheel',e=>{ if(e.ctrlKey || Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return; const can=list.scrollHeight>list.clientHeight;
  if(can && list.contains(e.target)) return;   // над самим списком — рідна плавна прокрутка; overscroll-behavior не передає її аркушу
  e.preventDefault(); if(can && !setPop.contains(e.target)) list.scrollTop+=e.deltaY*(e.deltaMode===1? 16 : e.deltaMode===2? list.clientHeight : 1); },{passive:false});
new ResizeObserver(()=>side.style.setProperty('--foot', sideFoot.offsetHeight+'px')).observe(sideFoot);   // підвал лежить поверх низу списку: список лишає під ним стільки ж місця

/* ══ PWA: офлайн-оболонка і встановлення ══════════════════════════════════ */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{});
/* a newer build on the server: «Доступна нова версія · Оновити». An open page keeps its code until it is reloaded (a tab left open, the
   installed app kept in memory, a start from the cache while the network was down), so it asks for build.json (never cached by the worker)
   at start, when it is shown again, when the network comes back and every half hour. «Оновити» reloads once nothing is left to save. */
const updStrip=$('updStrip'), updMsg=$('updMsg'), updGo=$('updGo'); let updAt=0, updT=0, updWant=false, updSeen=BUILD; $('buildV').textContent=loc('settings.build',{build:buildName(BUILD)});   // updSeen: the newest build shown or hidden with ✕; only a newer one shows the strip again
/* the journal of the last starts (BOOT, sheet:boot) under the version: when, how long, and for a start over 3 s the step that took longest; a
   start that never finished says what it was waiting for */
function bootPh(k){ k=String(k); return k==='main'? loc('boot.ph.load') : k==='db?'? loc('boot.ph.retry') : k==='sync'? loc('boot.ph.sync') : k==='move'? loc('boot.ph.move') : k==='notes'? loc('boot.ph.notes') : k==='start'? loc('boot.ph.ui') : loc('boot.ph.db'); }   // db, db!err, db!silent, lock:<kind>: the storage
const bootNext=k=>({main:'db', 'db?':'db', db:'sync', sync:'move', move:'notes', notes:'start'})[k]||'db';   // the step a stuck start waited for
function durTxt(ms){ const f=(v,u,d)=>new Intl.NumberFormat(I18N.locale,{style:'unit', unit:u, unitDisplay:'short', maximumFractionDigits:d}).format(v);
  if(ms<60000) return f(ms/1000,'second', ms<10000? 1 : 0); const m=Math.floor(ms/60000), sec=Math.round(ms%60000/1000); return f(m,'minute',0)+(sec? ' '+f(sec,'second',0) : ''); }
function bootUI(){ let all=[]; try{ all=JSON.parse(localStorage.getItem('sheet:boot')||'[]'); }catch(_){} if(!Array.isArray(all)) all=[];
  const fmt=new Intl.DateTimeFormat(I18N.locale,{day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
  const lines=all.slice(-3).reverse().map(r=>{ const m=Array.isArray(r && r.m)? r.m : [], end=m.find(x=>x[0]==='start'), when=fmt.format(new Date(r.at||0));
    if(!end){ if(r.id===BOOT.id) return loc('boot.now',{when}); const last=m[m.length-1]||['main',0]; return loc('boot.stuck',{when, total:durTxt(Math.max(r.w||0, last[1])), phase:bootPh(bootNext(last[0]))}); }
    const total=end[1]; if(total<3000) return loc('boot.line',{when, total:durTxt(total)});
    let best=null, prev=0; for(const [k,t] of m){ if(!best || t-prev>best.g) best={k, g:t-prev}; prev=t; if(k==='start') break; }
    const n=m.filter(x=>x[0]==='db?').length, p={when, total:durTxt(total), phase:bootPh(best.k), dur:durTxt(best.g), n};
    return n>1? loc('boot.slowTries',p) : loc('boot.slowLine',p); });
  $('bootV').textContent=lines.length? loc('boot.title')+'\n'+lines.join('\n') : ''; }
async function updCheck(force){ if(!/^https?:/.test(location.protocol) || document.hidden || !navigator.onLine || !updStrip.hidden) return; const t=Date.now(); if(!force && t-updAt<6e4) return; updAt=t; clearTimeout(updT);
  let r; try{ r=await fetch('./build.json',{cache:'no-store', signal:AbortSignal.timeout? AbortSignal.timeout(1e4) : undefined}); }catch(_){ updT=setTimeout(()=>updCheck(true),2e4); return; }   // the network is not there yet, or holds the request over 10 s: again in a while
  let b=0; try{ if(r.ok && /json/.test(r.headers.get('content-type')||'')) b=+(await r.json()).build||0; }catch(_){}   // not our JSON (a captive portal, a fallback page): nothing to compare
  if(b>updSeen && updStrip.hidden){ updSeen=b; updMsg.textContent=''; updStrip.hidden=false; requestAnimationFrame(()=>{ updMsg.textContent=loc('update.available'); }); } }   // the text goes in after the strip shows, so a screen reader announces it
const updBusy=()=>dirty || unsaved.size>0 || inflight.size>0 || REVIVING.size>0;
function updTry(){ if(!updWant) return; if(updBusy()){ if(LOCK){ updMsg.textContent=loc('update.lockedUnsaved',{button:loc('update.reload')}); return; } updMsg.textContent=loc('update.waiting'); setTimeout(updTry,500); return; } location.reload(); }   // a view-only tab can never save: with nothing unsaved it reloads at once; with an unsaved edit it asks for the export first (its lock strip has it), and the second tap reloads
updGo.addEventListener('click',()=>{ if(updWant){ location.reload(); return; } updWant=true; flushSave(); updTry(); });   // a second tap while waiting reloads anyway; the browser still asks first if something is unsaved
$('updX').addEventListener('click',()=>{ updWant=false; updStrip.hidden=true; });
{ const toastH=()=>updStrip.style.setProperty('--toastH', toast.classList.contains('show')? toast.offsetHeight+'px' : '0px');   // a toast (a long one wraps on a phone) pushes the strip up while it shows
  new MutationObserver(toastH).observe(toast,{attributes:true, attributeFilter:['class']}); if(window.ResizeObserver) new ResizeObserver(toastH).observe(toast); }   // its height changes too when the phone turns
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) updCheck(); }); window.addEventListener('online',()=>updCheck(true));
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange',()=>updCheck(true));   // a new worker took over: a deploy happened
setTimeout(()=>updCheck(true),3000); setInterval(()=>updCheck(true),18e5);
let deferredInstall=EARLY.install||null; installBtn.hidden=!deferredInstall;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; installBtn.hidden=false; });
installBtn.addEventListener('click',async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(_){} deferredInstall=null; installBtn.hidden=true; });
window.addEventListener('appinstalled',()=>{ installBtn.hidden=true; iosHint.hidden=true; });
if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches) iosHint.hidden=false;
}
// A file of this build was refused (a deploy landed between the page and its files) or did not come: the page reloads once and gets one
// whole build again. Without the core it never starts half-way: if the reload did not help, the update strip says so and offers a reload.
function torn(){ const core=!!window.BaobookSync && !!window.BaobookCloud, u=new URL(location.href);
  if((!core || I18N.refused) && !TORN){ u.searchParams.set('torn','1'); location.replace(u.href); return true; }   // the one reload, marked in its address
  if(core){ if(TORN){ u.searchParams.delete('torn'); history.replaceState(history.state, '', u.href); } return false; }   // the app starts: the next refused file reloads again
  const $=id=>document.getElementById(id); localize(); $('updMsg').textContent=loc('update.broken'); $('updX').hidden=true; $('updGo').addEventListener('click',()=>location.reload());   // a manual reload keeps ?torn=1: no automatic one after it
  $('updStrip').style.visibility='visible'; $('updStrip').hidden=false;   // the rest of the page stays hidden: the app never started
  return true; }
loadStrings().then(()=>{ if(torn()) return; localize(); try{ main(); } finally{ document.documentElement.dataset.ready=''; } });
