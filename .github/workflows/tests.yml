name: Baobook tests

on:
  push:
    branches: [main]
    paths: ['public/**', 'tests/**', 'worker/**', 'wrangler.jsonc', '.github/workflows/tests.yml', 'firestore.rules', 'firebase.json']
  pull_request:
    paths: ['public/**', 'tests/**', 'worker/**', 'wrangler.jsonc', '.github/workflows/tests.yml', 'firestore.rules', 'firebase.json']
  workflow_dispatch:

# A new push to a pull request cancels the run of its previous commit. Pushes to main are never cancelled: the build-marker job
# compares each merge with the one before it.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  # The scenarios in tests/*.mjs run on SHARDS runners at once, each with its own Chromium (tests/lib/shard.mjs splits them by
  # measured time). Chromium comes from a cache keyed by the Playwright version; `playwright install --with-deps` is not used:
  # ubuntu-latest already has the libraries Chromium needs, and the step spent up to 14 minutes on apt fetching CJK fonts.
  playwright:
    name: scenarios ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium cache
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - name: Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Scenarios of shard ${{ matrix.shard }}
        run: |
          status=0
          for f in $(node tests/lib/shard.mjs ${{ matrix.shard }} $SHARDS); do
            n=$(basename "$f" .mjs)
            echo "::group::$n"
            if node "$f"; then echo "PASS $n"; else echo "FAIL $n"; status=1; fi
            echo "::endgroup::"
          done
          exit $status
      - name: Scenario screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-screenshots-${{ matrix.shard }}
          path: /tmp/sheet-tests
          if-no-files-found: ignore

  # Every change of public/ raises BUILD (public/index.html: the constant and <meta name="baobook-build">; public/build.json), so an open
  # page older than the server shows «Доступна нова версія». On a pull request the checkout is the merge commit and HEAD^1 is the base; on a
  # push to main HEAD^1 is the previous main, so two parallel PRs that both took the same BUILD fail loudly on main after the second merge.
  build-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: A change of public/ raises BUILD
        run: |
          if git diff --quiet HEAD^1 HEAD -- public/; then echo "public/ unchanged"; exit 0; fi
          old=$(git show HEAD^1:public/index.html | grep -oP 'const BUILD=\K\d+' || echo 0)
          new=$(grep -oP 'const BUILD=\K\d+' public/index.html || true)
          : "${new:?const BUILD not found in public/index.html}"
          echo "BUILD $old -> $new"
          if [ "$new" -le "$old" ]; then echo "::error::public/ changed: raise BUILD in public/index.html (the constant and the meta tag) and in public/build.json"; exit 1; fi

  # The Firestore security rules (firestore.rules, docs/SYNC-PLAN.md §4.16) on the emulator under the demo project id: no request
  # reaches the real Firebase. firebase-tools, the rules test library and the SDK are pinned in tests/rules/package-lock.json.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: firebase-tools and the rules test library
        run: npm ci
      - name: Firestore emulator download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/rules/package-lock.json') }}
      - name: Security rules and the Firestore adapter on the Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-baobook "node firestore.mjs && node adapter.mjs"

  # The sync scenarios on the Auth and Firestore emulators (tests/emu/*.mjs, docs/SYNC-PLAN.md PR 3): Playwright drives the app with the
  # Firebase SDK served from a local cache in place of gstatic; every other request to a Google host is aborted, so nothing reaches the real
  # project. The emulators come from firebase-tools in tests/rules; Playwright and the Chromium cache as in the first job.
  sync-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: firebase-tools (tests/rules)
        run: npm ci
        working-directory: tests/rules
      - name: Playwright
        run: npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium cache
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - name: Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Firebase emulators download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/rules/package-lock.json') }}
      - name: Firebase SDK files cache
        uses: actions/cache@v4
        with:
          path: tests/emu/.sdk
          key: firebase-sdk-${{ hashFiles('tests/emu/lib/emu.mjs') }}
      - name: Scenarios on the Auth and Firestore emulators
        working-directory: tests/rules
        run: |
          npx firebase emulators:exec --only auth,firestore --project demo-baobook '
            status=0
            for f in ../emu/*.mjs; do
              n=$(basename "$f" .mjs)
              echo "::group::$n"
              if node "$f"; then echo "PASS $n"; else echo "FAIL $n"; status=1; fi
              echo "::endgroup::"
            done
            exit $status'
      - name: Scenario screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-screenshots
          path: /tmp/sheet-tests
          if-no-files-found: ignore
