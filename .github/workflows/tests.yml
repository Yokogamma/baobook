name: Тести «Чистого аркуша»

on:
  push:
    branches: [main]
    paths: ['sheet/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['sheet/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright і Chromium
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Усі сценарії sheet/tests
        run: |
          status=0
          for f in sheet/tests/*.mjs; do
            n=$(basename "$f" .mjs)
            echo "::group::$n"
            if node "$f"; then echo "PASS $n"; else echo "FAIL $n"; status=1; fi
            echo "::endgroup::"
          done
          exit $status
      - name: Знімки сценаріїв
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-tests-screenshots
          path: /tmp/sheet-tests
          if-no-files-found: ignore
